[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
layout = { path = "../layout" }
net = { path = "../net" }

# Security-critical by construction, so it falls inside the dependency rule set
# in issue #4 rather than needing a separate argument. `seccompiler` is AWS's,
# maintained for Firecracker, and it is what holds the `unsafe` that installing
# a BPF filter requires — ADR-0002 forbids it here, not everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5"

# The AppContainer half (ADR-0014). This is where the `unsafe` that
# `CreateProcess`-with-a-security-capabilities-attribute requires actually
# lives; ADR-0002 forbids it in this workspace, not in the world.
[target.'cfg(target_os = "windows")'.dependencies]
rappct = "=0.13.3"

# The App Sandbox half (ADR-0017), and the exception to the pattern above: the
# other two platforms had a crate holding the `unsafe` for us, and macOS has
# none — `sandbox_init` has no safe wrapper on crates.io. So this one is ours,
# quarantined to a page of code in the only crate here that may write `unsafe`.
[target.'cfg(target_os = "macos")'.dependencies]
seatbelt = { path = "../seatbelt" }


[lints]
workspace = true
