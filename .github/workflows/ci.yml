name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Linux, macOS, and Windows are all first-class from M1 (ADR-0005), so the
  # matrix is not "Linux plus two afterthoughts" — a failure on any of the three
  # is a failure. No third-party actions: rustup honours rust-toolchain.toml and
  # installs the pinned components on its own.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the reference tests, which compare rendered output against a
      # single baseline set shared by all three platforms (ADR-0005). A
      # per-platform pixel difference is a bug, and this is where it surfaces.
      - name: Test
        run: cargo test --workspace

      - name: Upload reference-test diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-actual-${{ matrix.os }}
          path: tests/ref/baselines/*.actual.png
          if-no-files-found: ignore

      - name: Build (release)
        run: cargo build --release

      # Budgets run on every platform: binary size is platform-dependent, and a
      # regression on one target is still a regression.
      - name: Budgets
        run: cargo run --release -p budgets

      # The window is the one part with no automated coverage — CI has no
      # display, so event handling and blitting have always been exercised by
      # hand and by nothing else. Xvfb closes most of that gap. Linux only,
      # because that is where a virtual display is one package; the script
      # skips rather than fails if Xvfb is missing, since a check that cannot
      # run must not look like a check that passed.
      - name: Window smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxkbcommon-x11-0
          cargo build -p shell
          ./scripts/smoke-window.sh
