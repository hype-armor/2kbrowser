<!doctype html>
<html>
<head><title>Wide</title></head>
<body bgcolor="#ffffff">
<!--
  A page far wider than any window this harness opens, for #204.

  The red block sits past 1600px, which is twice the harness's 800px window and
  well past anything a first band paints. It is red rather than black because
  the page's own text is ink too, and a check that counted dark pixels would
  find the paragraph below instead of the block it meant.
-->
<div style="width: 2200px">
  <div style="width: 400px; height: 500px; background: #ff0000; margin-left: 1700px"></div>
  <p>The left edge of a page that is much wider than the window showing it.</p>
</div>
</body>
</html>
