<!doctype html><html><head><style>
  body { margin: 12px; }
  .plain  { border: 3px solid #333333; padding: 8px; margin-bottom: 10px; }
  .thick  { border: 8px solid #0055aa; padding: 4px; margin-bottom: 10px; }
  .sides  { border: 4px solid; border-top-color: #cc0000; border-right-color: #007700;
            border-bottom-color: #0000cc; border-left-color: #aa8800;
            padding: 6px; margin-bottom: 10px; }
  .partial{ border-left: 6px solid #999999; padding-left: 10px; margin-bottom: 10px; }
  .nostyle{ border-width: 20px; padding: 4px; margin-bottom: 10px; }
  .fixed  { width: 150px; border: 2px solid #000000; padding: 10px; }
</style></head><body>
<div class="plain">A uniform solid border.</div>
<div class="thick">A thicker border with less padding.</div>
<div class="sides">Four differently coloured edges.</div>
<div class="partial">Only a left border, as used for blockquotes.</div>
<div class="nostyle">border-width with no border-style occupies nothing.</div>
<div class="fixed">Explicit width is the content width.</div>
</body></html>
