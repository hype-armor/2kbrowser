<!doctype html><html><head><style>
  .mono { font-family: monospace; }
  .sans { font-family: Arial, sans-serif; }
  .serif { font-family: Georgia, serif; }
  .big { font-size: 24px; font-weight: bold; }
  .it { font-style: italic; }
  .right { text-align: right; }
</style></head><body>
<p class="mono">Monospace: iiiiwwww</p>
<p class="sans">Sans-serif via Arial substitution.</p>
<p class="serif">Serif via Georgia substitution.</p>
<p class="big">Large and bold.</p>
<p class="it">Italic text.</p>
<p class="right">Right aligned.</p>
</body></html>
